<svg xmlns="http://www.w3.org/2000/svg" width="440" height="250" viewBox="0 0 440 250" role="img" aria-label="Rendering design"><rect width="440" height="250" fill="#0D1117"/><style>.m{font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, monospace}</style><text x="20" y="30" class="m" fill="#8B949E" font-size="12" font-weight="700">03 / RENDER ONLY WHAT MATTERS</text><line x1="20" y1="48" x2="420" y2="48" stroke="#30363D"/><text x="20" y="86" class="m" fill="#E6EDF3" font-size="13">scene → cull → jobs → instanced draw</text><text x="20" y="132" class="m" fill="#8B949E" font-size="12">Optimization begins by avoiding work,</text><text x="20" y="158" class="m" fill="#8B949E" font-size="12">not merely executing all work faster.</text><text x="20" y="220" class="m" fill="#FF7A1A" font-size="12">custom culling + instancing + Jobs</text></svg>