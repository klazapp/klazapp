<svg xmlns="http://www.w3.org/2000/svg" width="440" height="270" viewBox="0 0 440 270" role="img" aria-label="Dynamic navigation"><rect width="440" height="270" fill="#0D1117"/><style>.m{font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, monospace}</style><text x="20" y="30" class="m" fill="#8B949E" font-size="12" font-weight="700">01 / TOPOLOGY CHANGES</text><line x1="20" y1="48" x2="420" y2="48" stroke="#30363D"/><text x="20" y="82" class="m" fill="#E6EDF3" font-size="14">route v17 → topology v18</text><text x="20" y="124" class="m" fill="#FF7A1A" font-size="14">stale → validate → replan</text><text x="20" y="168" class="m" fill="#8B949E" font-size="13">No route? Keep destination pending.</text><text x="20" y="194" class="m" fill="#8B949E" font-size="13">Connectivity returns? Route again.</text><text x="20" y="240" class="m" fill="#FF7A1A" font-size="12">Route.cs + RouteFinder.cs</text></svg>