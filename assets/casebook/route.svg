<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" role="img" aria-label="Dynamic navigation topology change"><rect width="1000" height="320" fill="#0D1117"/><style>.m{font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, monospace}</style><rect x="1" y="1" width="998" height="318" rx="7" fill="#0F141B" stroke="#30363D"/><text x="26" y="34" class="m" fill="#8B949E" font-size="13" font-weight="700">01 / TOPOLOGY CHANGES</text><line x1="25" y1="54" x2="975" y2="54" stroke="#30363D"/><text x="26" y="82" class="m" fill="#8B949E" font-size="12">v17 / route calculated</text><polyline points="54,140 125,105 197,140 270,140" fill="none" stroke="#FF7A1A" stroke-width="3"/><line x1="270" y1="140" x2="341" y2="105" stroke="#E6EDF3" stroke-width="2"/><circle cx="54" cy="140" r="6" fill="#FF7A1A"/><circle cx="125" cy="105" r="6" fill="#FF7A1A"/><circle cx="197" cy="140" r="6" fill="#FF7A1A"/><circle cx="270" cy="140" r="6" fill="#FF7A1A"/><circle cx="341" cy="105" r="6" fill="#E6EDF3"/><text x="26" y="198" class="m" fill="#8B949E" font-size="12">v18 / bridge removed</text><polyline points="54,250 125,215 197,250" fill="none" stroke="#8B949E" stroke-width="2"/><line x1="197" y1="250" x2="270" y2="250" stroke="#8B949E" stroke-width="2" stroke-dasharray="6 7"/><line x1="250" y1="231" x2="290" y2="269" stroke="#FF7A1A" stroke-width="3"/><line x1="290" y1="231" x2="250" y2="269" stroke="#FF7A1A" stroke-width="3"/><line x1="430" y1="75" x2="430" y2="294" stroke="#30363D"/><text x="462" y="102" class="m" fill="#E6EDF3" font-size="17">route.TopologyVersion</text><text x="462" y="130" class="m" fill="#FF7A1A" font-size="17">!= topology.TopologyVersion</text><text x="462" y="168" class="m" fill="#8B949E" font-size="14">stale route → validate remaining segment</text><text x="462" y="196" class="m" fill="#8B949E" font-size="14">invalid segment → request a new route</text><text x="462" y="224" class="m" fill="#8B949E" font-size="14">no route → keep destination pending</text><text x="462" y="252" class="m" fill="#8B949E" font-size="14">connectivity returns → route again</text><text x="462" y="286" class="m" fill="#FF7A1A" font-size="13">implementation: Route.cs + RouteFinder.cs</text></svg>