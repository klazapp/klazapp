<svg xmlns="http://www.w3.org/2000/svg" width="440" height="275" viewBox="0 0 440 275" role="img" aria-label="Layout architecture"><rect width="440" height="275" fill="#0D1117"/><style>.m{font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, monospace}</style><text x="20" y="30" class="m" fill="#8B949E" font-size="12" font-weight="700">04 / LAYOUT AS DATA</text><line x1="20" y1="48" x2="420" y2="48" stroke="#30363D"/><text x="20" y="86" class="m" fill="#E6EDF3" font-size="13">layout ≠ components ≠ data mapping</text><rect x="20" y="120" width="185" height="52" rx="4" fill="#18212B" stroke="#FF7A1A"/><rect x="215" y="120" width="95" height="52" rx="4" fill="#141B23" stroke="#30363D"/><rect x="320" y="120" width="100" height="52" rx="4" fill="#141B23" stroke="#30363D"/><text x="20" y="216" class="m" fill="#8B949E" font-size="12">Change arrangement without forcing cards</text><text x="20" y="242" class="m" fill="#8B949E" font-size="12">to own layout behavior.</text></svg>